<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de Administración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Header -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Panel de Administración</span>
    </div>
  </nav>

  <div class="container my-5">
    <!-- Pestañas -->
    <ul class="nav nav-tabs" id="adminTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tiendas-tab" data-bs-toggle="tab" data-bs-target="#tiendas" type="button" role="tab">Agregar Tienda</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="productos-tab" data-bs-toggle="tab" data-bs-target="#productos" type="button" role="tab">Agregar Producto</button>
      </li>
    </ul>

    <!-- Contenido de las pestañas -->
    <div class="tab-content mt-4" id="adminTabContent">
      <!-- Formulario de tienda -->
      <div class="tab-pane fade show active" id="tiendas" role="tabpanel">
        <h3>Agregar Tienda</h3>
        <form>
          <div class="mb-3">
            <label class="form-label">Nombre de la tienda</label>
            <input type="text" class="form-control" placeholder="Ej. AudioPlus" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Dirección del sitio web</label>
            <input type="url" class="form-control" placeholder="https://www.ejemplo.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Ubicación (provincia o ciudad)</label>
            <input type="text" class="form-control" placeholder="Ej. San José" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Medallas o distintivos</label>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="envioGratis">
              <label class="form-check-label" for="envioGratis">Envío gratis</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="tiendaDestacada">
              <label class="form-check-label" for="tiendaDestacada">Tienda destacada</label>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Guardar tienda</button>
        </form>
      </div>

      <!-- Formulario de producto -->
      <div class="tab-pane fade" id="productos" role="tabpanel">
        <h3>Agregar Producto</h3>
        <form>
          <div class="mb-3">
            <label class="form-label">Nombre del producto</label>
            <input type="text" class="form-control" placeholder="Ej. Audífonos Bluetooth X" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" class="form-control" placeholder="25000" required>
          </div>
          <div class="mb-3">
            <label class="form-label">URL del producto</label>
            <input type="url" class="form-control" placeholder="https://www.ejemplo.com/producto" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Imagen (URL)</label>
            <input type="url" class="form-control" placeholder="https://www.ejemplo.com/imagen.jpg">
          </div>
          <div class="mb-3">
            <label class="form-label">Tienda asociada</label>
            <select class="form-select">
              <option selected>Seleccione una tienda</option>
              <option>AudioPlus</option>
              <option>Tecnolab</option>
              <!-- Esto será dinámico con PHP más adelante -->
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Guardar producto</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
