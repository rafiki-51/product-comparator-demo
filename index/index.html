<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparador de Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">MiComparador</a>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container my-5 flex-grow-1">
    <!-- Buscador -->
    <h1 class="text-center mb-4">Busca el producto que necesitas</h1>
    <form id="form-busqueda" class="d-flex justify-content-center mb-5">
      <input type="text" id="input-busqueda" class="form-control w-50 me-2" placeholder="Ej. audífonos bluetooth" required>
      <button type="submit" class="btn btn-primary">Buscar</button>
    </form>

    <!-- Resultados -->
    <h2 class="mb-4">Resultados</h2>
    <div class="row" id="resultados">
      <!-- Los productos se cargan dinámicamente con JavaScript -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-4 mt-auto">
    <p class="mb-0">&copy; 2025 MiComparador. Todos los derechos reservados.</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Lista de productos simulados
    const productos = [
      {
        nombre: "Audífonos Bluetooth X",
        precio: 25000,
        tienda: "AudioPlus",
        imagen: "https://via.placeholder.com/300x200",
        enlace: "#",
        medallas: ["envioGratis", "tiendaDestacada"]
      },
      {
        nombre: "Audífonos Bluetooth Y",
        precio: 23500,
        tienda: "Tecnolab",
        imagen: "https://via.placeholder.com/300x200",
        enlace: "#",
        medallas: ["medallaOro"]
      },
      {
        nombre: "Parlante portátil Z",
        precio: 32000,
        tienda: "ElectroTico",
        imagen: "https://via.placeholder.com/300x200",
        enlace: "#",
        medallas: []
      }
    ];

    // Función para generar medallas según el array
    function generarMedallas(medallas) {
      const badges = {
        envioGratis: `<span class="badge bg-success me-1">Envío gratis</span>`,
        tiendaDestacada: `<span class="badge bg-warning text-dark me-1">Tienda destacada</span>`,
        medallaOro: `<span class="badge bg-primary me-1">Medalla de Oro</span>`
      };

      return medallas.map(m => badges[m] || "").join(" ");
    }

    // Mostrar productos en el contenedor
    function mostrarProductos(lista) {
      const contenedor = document.getElementById("resultados");
      contenedor.innerHTML = "";

      if (lista.length === 0) {
        contenedor.innerHTML = `<div class="col-12"><p class="text-muted text-center">No se encontraron productos.</p></div>`;
        return;
      }

      lista.forEach(p => {
        const card = document.createElement("div");
        card.className = "col-md-4 mb-4";
        card.innerHTML = `
          <div class="card h-100 shadow-sm">
            <img src="${p.imagen}" class="card-img-top" alt="${p.nombre}">
            <div class="card-body">
              <h5 class="card-title">${p.nombre}</h5>
              <p class="card-text">₡${p.precio.toLocaleString()} – ${p.tienda}</p>
              ${generarMedallas(p.medallas)}
              <a href="${p.enlace}" class="btn btn-outline-primary w-100 mt-3">Ir al sitio</a>
            </div>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    // Filtro de búsqueda por nombre del producto
    document.getElementById("form-busqueda").addEventListener("submit", function (e) {
      e.preventDefault();
      const texto = document.getElementById("input-busqueda").value.toLowerCase();
      const resultadosFiltrados = productos.filter(p => p.nombre.toLowerCase().includes(texto));
      mostrarProductos(resultadosFiltrados);
    });

    // Mostrar todos los productos al inicio
    document.addEventListener("DOMContentLoaded", () => {
      mostrarProductos(productos);
    });
  </script>
</body>
</html>
